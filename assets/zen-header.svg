<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <style>
    .jp { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'MS Mincho', serif; }
    .latin { font-family: 'Georgia', 'Times New Roman', serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

    .sun { animation: breathe 6s ease-in-out infinite; transform-origin: 765px 130px; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: .92; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .sun-glow { animation: haze 6s ease-in-out infinite; transform-origin: 765px 130px; }
    @keyframes haze {
      0%, 100% { opacity: .3; }
      50% { opacity: .55; }
    }

    .petal { fill: #f2a7b8; opacity: .85; }
    .fall { animation: fall 10s linear infinite; }
    .fall.p2 { animation-delay: 2.5s; animation-duration: 12s; }
    .fall.p3 { animation-delay: 5s; animation-duration: 9s; }
    .fall.p4 { animation-delay: 7.5s; animation-duration: 13s; }
    @keyframes fall {
      0%   { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
      8%   { opacity: .85; }
      50%  { transform: translate(-24px, 150px) rotate(160deg); opacity: .75; }
      100% { transform: translate(14px, 330px) rotate(320deg); opacity: 0; }
    }

    .kanji-col { animation: inkfade 8s ease-in-out infinite; }
    @keyframes inkfade {
      0%, 100% { opacity: .45; }
      50% { opacity: .8; }
    }

    .cursor { animation: blink 1.1s step-end infinite; fill: #e0342c; }
    @keyframes blink { 50% { opacity: 0; } }

    .stroke-draw { stroke-dasharray: 360; animation: draw 5s ease-out infinite; }
    @keyframes draw {
      0% { stroke-dashoffset: 360; opacity: 0; }
      12% { opacity: 1; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset=".7" stop-color="#10131b"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="765" cy="130" r="125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0342c" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#e0342c" stop-opacity=".1"/>
      <stop offset="1" stop-color="#e0342c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="765" cy="122" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#c22a24"/>
    </radialGradient>
    <pattern id="seigaiha" width="80" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#2a3242" stroke-width="1.5">
        <circle cx="40" cy="40" r="36"/>
        <circle cx="40" cy="40" r="26"/>
        <circle cx="40" cy="40" r="16"/>
        <circle cx="40" cy="40" r="6"/>
        <circle cx="0" cy="40" r="36"/>
        <circle cx="0" cy="40" r="26"/>
        <circle cx="0" cy="40" r="16"/>
        <circle cx="80" cy="40" r="36"/>
        <circle cx="80" cy="40" r="26"/>
        <circle cx="80" cy="40" r="16"/>
      </g>
    </pattern>
    <clipPath id="waveClip"><rect x="0" y="240" width="900" height="60"/></clipPath>
  </defs>

  <!-- fundo tinta -->
  <rect width="900" height="300" rx="12" fill="url(#ink)"/>

  <!-- sol vermelho (direita, sem tocar no texto) -->
  <circle class="sun-glow" cx="765" cy="130" r="125" fill="url(#sunGlow)"/>
  <circle class="sun" cx="765" cy="130" r="82" fill="url(#sunBody)"/>

  <!-- torii dentro do sol -->
  <g fill="#0b0e14">
    <path d="M703 102 Q765 84 827 102 L824 114 Q765 97 706 114 Z"/>
    <rect x="719" y="110" width="92" height="9" rx="2"/>
    <rect x="728" y="119" width="10" height="70" rx="2"/>
    <rect x="792" y="119" width="10" height="70" rx="2"/>
    <rect x="721" y="141" width="88" height="7" rx="2"/>
  </g>

  <!-- ondas seigaiha na base -->
  <g clip-path="url(#waveClip)" opacity=".45">
    <rect x="0" y="240" width="900" height="60" fill="url(#seigaiha)"/>
  </g>

  <!-- kanji marca d'água: 匠 (takumi) -->
  <text class="jp" x="38" y="220" font-size="150" fill="none" stroke="#2a3242" stroke-width="1.5" opacity=".7">匠</text>

  <!-- kanji vertical: 人工知能 -->
  <g class="jp kanji-col" fill="#8b949e" font-size="26" text-anchor="middle">
    <text x="872" y="230">人</text>
    <text x="872" y="262">工</text>
  </g>
  <g class="jp kanji-col" fill="#8b949e" font-size="26" text-anchor="middle" opacity=".6">
    <text x="30" y="52">知</text>
    <text x="30" y="84">能</text>
  </g>

  <!-- bloco de texto (área reservada: x 200-660, nunca encosta no sol) -->
  <text class="jp" x="205" y="92" font-size="18" fill="#e0342c" letter-spacing="5">ロドリゴ・スミオシ</text>
  <text class="latin" x="200" y="146" font-size="38" font-weight="700" fill="#f0f0eb" letter-spacing="2">RODRIGO SUMIOSHI</text>
  <path class="stroke-draw" d="M203 164 Q380 156 585 162" stroke="#e0342c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <text class="latin" x="203" y="192" font-size="14" fill="#9aa4b2" letter-spacing="7">FULLSTACK AI DEVELOPER</text>

  <!-- linha mono -->
  <g class="mono" font-size="13">
    <text x="203" y="222" fill="#e0342c">$</text>
    <text x="218" y="222" fill="#8b949e">shokunin --craft "produtos com IA" --kaizen</text>
    <rect class="cursor" x="530" y="210" width="7" height="14"/>
  </g>

  <!-- pétalas de sakura (só nas laterais, longe do texto) -->
  <g>
    <ellipse class="petal fall"    cx="120" cy="0" rx="5" ry="3"/>
    <ellipse class="petal fall p2" cx="60"  cy="0" rx="4" ry="2.5"/>
    <ellipse class="petal fall p3" cx="660" cy="0" rx="4.5" ry="2.8"/>
    <ellipse class="petal fall p4" cx="840" cy="0" rx="4" ry="2.5"/>
  </g>
</svg>
