<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .jp { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'MS Mincho', serif; }
    .latin { font-family: 'Georgia', 'Times New Roman', serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

    .sun { animation: breathe 6s ease-in-out infinite; transform-origin: 640px 150px; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: .92; }
      50% { transform: scale(1.035); opacity: 1; }
    }
    .sun-glow { animation: haze 6s ease-in-out infinite; transform-origin: 640px 150px; }
    @keyframes haze {
      0%, 100% { opacity: .35; }
      50% { opacity: .6; }
    }

    .petal { fill: #f2a7b8; opacity: .85; }
    .fall { animation: fall 9s linear infinite; }
    .fall.p2 { animation-delay: 2s; animation-duration: 11s; }
    .fall.p3 { animation-delay: 4s; animation-duration: 8s; }
    .fall.p4 { animation-delay: 6s; animation-duration: 12s; }
    .fall.p5 { animation-delay: 1s; animation-duration: 10s; }
    .fall.p6 { animation-delay: 7s; animation-duration: 9.5s; }
    @keyframes fall {
      0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
      8%   { opacity: .9; }
      50%  { transform: translate(-28px, 160px) rotate(160deg); opacity: .8; }
      100% { transform: translate(18px, 350px) rotate(320deg); opacity: 0; }
    }

    .mist { animation: drift 14s ease-in-out infinite alternate; }
    .mist.m2 { animation-delay: 4s; animation-duration: 18s; }
    @keyframes drift {
      from { transform: translateX(-25px); opacity: .05; }
      50%  { opacity: .1; }
      to   { transform: translateX(25px); opacity: .05; }
    }

    .kanji-col { animation: inkfade 8s ease-in-out infinite; }
    @keyframes inkfade {
      0%, 100% { opacity: .5; }
      50% { opacity: .85; }
    }

    .cursor { animation: blink 1.1s step-end infinite; fill: #e0342c; }
    @keyframes blink { 50% { opacity: 0; } }

    .stroke-draw { stroke-dasharray: 420; animation: draw 5s ease-out infinite; }
    @keyframes draw {
      0% { stroke-dashoffset: 420; opacity: 0; }
      12% { opacity: 1; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset=".7" stop-color="#10131b"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="640" cy="150" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0342c" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#e0342c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e0342c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="640" cy="140" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#c22a24"/>
    </radialGradient>
    <!-- seigaiha (ondas) -->
    <pattern id="seigaiha" width="80" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#2a3242" stroke-width="1.5">
        <circle cx="40" cy="40" r="36"/>
        <circle cx="40" cy="40" r="26"/>
        <circle cx="40" cy="40" r="16"/>
        <circle cx="40" cy="40" r="6"/>
        <circle cx="0" cy="40" r="36"/>
        <circle cx="0" cy="40" r="26"/>
        <circle cx="0" cy="40" r="16"/>
        <circle cx="80" cy="40" r="36"/>
        <circle cx="80" cy="40" r="26"/>
        <circle cx="80" cy="40" r="16"/>
      </g>
    </pattern>
    <clipPath id="waveClip"><rect x="0" y="250" width="900" height="70" rx="0"/></clipPath>
  </defs>

  <!-- fundo tinta -->
  <rect width="900" height="320" rx="12" fill="url(#ink)"/>

  <!-- névoa -->
  <ellipse class="mist" cx="250" cy="90" rx="220" ry="34" fill="#8b949e"/>
  <ellipse class="mist m2" cx="620" cy="230" rx="260" ry="30" fill="#8b949e"/>

  <!-- sol vermelho -->
  <circle class="sun-glow" cx="640" cy="150" r="150" fill="url(#sunGlow)"/>
  <circle class="sun" cx="640" cy="150" r="95" fill="url(#sunBody)"/>

  <!-- torii dentro do sol -->
  <g fill="#0b0e14">
    <path d="M566 118 Q640 96 714 118 L710 132 Q640 112 570 132 Z"/>
    <rect x="586" y="128" width="108" height="10" rx="2"/>
    <rect x="596" y="138" width="12" height="82" rx="2"/>
    <rect x="672" y="138" width="12" height="82" rx="2"/>
    <rect x="588" y="164" width="104" height="8" rx="2"/>
  </g>

  <!-- ondas seigaiha na base -->
  <g clip-path="url(#waveClip)" opacity=".5">
    <rect x="0" y="250" width="900" height="70" fill="url(#seigaiha)"/>
  </g>

  <!-- kanji vertical: 人工知能 (inteligência artificial) -->
  <g class="jp kanji-col" fill="#8b949e" font-size="30" text-anchor="middle">
    <text x="852" y="70">人</text>
    <text x="852" y="110">工</text>
    <text x="852" y="150">知</text>
    <text x="852" y="190">能</text>
  </g>
  <line x1="852" y1="205" x2="852" y2="250" stroke="#e0342c" stroke-width="2"/>

  <!-- kanji marca d'água: 匠 (takumi, mestre artesão) -->
  <text class="jp" x="60" y="235" font-size="170" fill="none" stroke="#2a3242" stroke-width="1.5" opacity=".8">匠</text>

  <!-- nome -->
  <text class="jp" x="255" y="106" font-size="20" fill="#e0342c" letter-spacing="6">ロドリゴ・スミオシ</text>
  <text class="latin" x="250" y="162" font-size="46" font-weight="700" fill="#f0f0eb" letter-spacing="3">RODRIGO SUMIOSHI</text>
  <!-- pincelada -->
  <path class="stroke-draw" d="M253 182 Q450 172 700 180" stroke="#e0342c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text class="latin" x="253" y="212" font-size="15" fill="#8b949e" letter-spacing="8">FULLSTACK AI DEVELOPER</text>

  <!-- linha mono -->
  <g class="mono" font-size="13">
    <text x="253" y="245" fill="#e0342c">$</text>
    <text x="268" y="245" fill="#8b949e">shokunin --craft "produtos com IA" --kaizen</text>
    <rect class="cursor" x="580" y="233" width="7" height="14"/>
  </g>

  <!-- pétalas de sakura -->
  <g>
    <ellipse class="petal fall"    cx="180" cy="10" rx="5" ry="3"/>
    <ellipse class="petal fall p2" cx="420" cy="10" rx="4" ry="2.5"/>
    <ellipse class="petal fall p3" cx="560" cy="10" rx="5" ry="3"/>
    <ellipse class="petal fall p4" cx="720" cy="10" rx="4" ry="2.5"/>
    <ellipse class="petal fall p5" cx="300" cy="10" rx="4.5" ry="2.8"/>
    <ellipse class="petal fall p6" cx="810" cy="10" rx="4" ry="2.5"/>
    <ellipse class="petal fall p3" cx="80"  cy="10" rx="4" ry="2.5"/>
  </g>
</svg>
